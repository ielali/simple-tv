name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publish the rolling "latest" release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint (advisory until first device build)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: simple-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Artifacts expire after 14 days; a release does not. Each main build replaces the "latest"
      # pre-release so there is always one stable link to the newest APK.
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk simple-tv.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest simple-tv.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build 0.1.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install with: adb install -r simple-tv.apk"
