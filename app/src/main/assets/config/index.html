<!--
  Telly caregiver page. Served by the TV itself (ConfigServer), so it is one self-contained file:
  no external fonts, scripts or images. Built from docs/design/handoff/Main.dc.html.
  Rules: never show a stream address or a provider password; error text never contains a URL.
-->
<style>
:root{--bg:#f4f4fc;--card:#fcfcfc;--tint:#f4f4fc;--line:#dcdce4;--ink:#1c1c1c;--muted:#6b6b78;--primary:#2464ec;--onp:#ffffff;--hl:#fcd444;--sky:#8cbcfc;--violet:#ac8cfc;--mint:#dcfcec;--okink:#0f7a43;--warnbg:#fff3c4;--warnink:#6b4a00;--errbg:#fde8e6;--errink:#a8201a;--ring:rgba(36,100,236,.2);--navy:#1B2A41;--gold:#FFC857;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--tint:#26262e;--line:#383844;--ink:#f3f3f6;--muted:#a9a9b8;--primary:#7aa4ff;--onp:#0b1220;--mint:#14382a;--okink:#6ee0a4;--warnbg:#3a3110;--warnink:#ffd96a;--errbg:#3f1d1b;--errink:#ffb4ac;--ring:rgba(122,164,255,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--tint:#26262e;--line:#383844;--ink:#f3f3f6;--muted:#a9a9b8;--primary:#7aa4ff;--onp:#0b1220;--mint:#14382a;--okink:#6ee0a4;--warnbg:#3a3110;--warnink:#ffd96a;--errbg:#3f1d1b;--errink:#ffb4ac;--ring:rgba(122,164,255,.3);color-scheme:dark}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:400 14px/20px Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif}
body *,body *::before,body *::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.toasts button,.dialog button{cursor:pointer}
.dialog h3,.dialog p{margin:0}
.app{min-height:100vh;min-height:100dvh;display:flex;background:var(--bg);color:var(--ink);font:400 14px/20px Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.app button,.app input,.app select{font:inherit;color:inherit}
.app h1,.app h2,.app h3,.app p{margin:0}
.app button{cursor:pointer}
.app :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.side{width:248px;flex:none;padding:20px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card);border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh}
.tablet .side{width:76px;align-items:center;padding:16px 8px}
.tablet .nlabel,.tablet .brandtext,.tablet .sidefoot .txt{display:none}
.phone .side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:700;font-size:16px}
.logo-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden}
.logo-mark svg{width:100%;height:100%;display:block}
.logo .ini{display:grid;place-items:center;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:600;text-decoration:none;background:none;border:0;width:100%;text-align:start}
.tablet .nav{width:48px;justify-content:center;padding:0}
.nav.on{background:var(--primary);color:var(--onp)}
.nav:not(.on):hover{background:var(--tint);color:var(--ink)}
.sidefoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--tint)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:28px 40px 0;flex-wrap:wrap}
.tablet .top{padding:24px 28px 0}
.phone .top{padding:16px 16px 0}
.titleblock{flex:1;min-width:200px}
.h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em}
.phone .h1{font-size:24px;line-height:28px}
.sub{color:var(--muted)}
.nowchip{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;background:var(--navy);color:#F2F4F8;font-weight:600;border:0;max-width:100%}
.nowchip>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowchip .n{min-width:32px;height:32px;padding:0 6px;border-radius:999px;background:var(--gold);color:#0B1220;display:grid;place-items:center;font-weight:800;flex:none}
.nowchip.off{background:var(--tint);color:var(--muted);padding:0 14px}
.nowbar{display:none}
.phone .nowbar{display:flex;margin:12px 16px 0}
.phone .nowchip.deskonly{display:none}
.content{padding:24px 40px 48px;display:flex;flex-direction:column;gap:24px;flex:1}
.tablet .content{padding:20px 28px 40px}
.phone .content{padding:16px 16px 32px;gap:16px}
.tabbar{display:none}
.phone .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border:0;background:none;color:var(--muted);font-size:11px;line-height:14px;font-weight:600;border-radius:12px;text-decoration:none}
.tab.on{color:var(--primary)}
.tab.add .plus{width:44px;height:44px;border-radius:999px;background:var(--primary);color:var(--onp);display:grid;place-items:center;margin-top:-14px;border:4px solid var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(28,28,28,.06)}
.phone .card{padding:16px}
.cols{display:grid;gap:24px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.tablet .cols,.phone .cols{grid-template-columns:minmax(0,1fr)}
.phone .cols{gap:16px}
.g2{display:grid;gap:24px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.phone .g2{grid-template-columns:minmax(0,1fr);gap:16px}
.f{display:flex;align-items:center}.fw{flex-wrap:wrap}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.sec{font-size:16px;line-height:22px;font-weight:700}
.cap{font-size:12px;line-height:16px;color:var(--muted)}
.muted{color:var(--muted)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--primary);color:var(--onp);border-color:transparent}
.btn.dng{color:var(--errink);border-color:var(--errink)}
.btn.ghost{border-color:transparent;background:none;color:var(--primary);padding:0 10px}
.btn.dis,.btn:disabled{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.ibtn{width:44px;height:44px;border-radius:999px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.ibtn.bd{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ibtn:hover{background:var(--tint)}
.ibtn.dis,.ibtn:disabled{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px;line-height:16px;white-space:nowrap;max-width:100%}
.pill.wrap{white-space:normal}
.pill.ok{background:var(--mint);color:var(--okink)}
.pill.warn{background:var(--warnbg);color:var(--warnink)}
.pill.err{background:var(--errbg);color:var(--errink)}
.pill.info{background:var(--tint);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-weight:700;font-size:11px;line-height:16px;color:#1c1c1c}
.badge.live{background:var(--sky)}.badge.yt{background:var(--violet)}
.badge.film,.badge.series{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:none;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(28,28,28,.12)}
.seg button .cap{margin-inline-start:4px}
.phone .seg.full{display:flex;width:100%}.phone .seg.full button{flex:1;padding:0 8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span:first-child{font-weight:600;font-size:13px}
.inp{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.inp.big{min-height:52px}
.inp input,.inp select{border:0;background:none;outline:0;flex:1;min-width:0;min-height:42px;padding:0}
.inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
/* The box shows the focus ring; the input inside it must not draw a second one. */
.app .inp input:focus-visible,.app .inp select:focus-visible{outline:none}
.inp.bad{border-color:var(--errink)}
.hint{font-size:12px;line-height:16px;color:var(--muted)}
.hint.err{color:var(--errink);font-weight:600}
.numfield{width:96px;flex:none}
.num{min-width:56px;height:56px;padding:0 6px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:28px;line-height:1;font-weight:800;letter-spacing:-.02em;flex:none;font-variant-numeric:tabular-nums}
.phone .num{min-width:48px;height:48px;font-size:24px;border-radius:12px}
.num.playing{background:var(--navy);color:var(--gold)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--muted);flex:none;overflow:hidden}
.logo{position:relative}.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card)}
.phone .logo{display:none}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;min-height:72px}
.lrow:hover,.lrow.sel{background:var(--tint)}
.lrow+.lrow,.editpanel+.lrow{margin-top:2px}
.lrow.bad{background:var(--warnbg)}
.lrow.dragging{opacity:.4}
.lrow.dropbefore{box-shadow:inset 0 3px 0 var(--primary)}
.lrow.dropafter{box-shadow:inset 0 -3px 0 var(--primary)}
.card.cardsview,.phone .card.cardsview,.tablet .card.cardsview{padding:0;background:none;border:0;box-shadow:none}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.phone .lgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lcard{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;min-width:0}
.lcard.sel{outline:2px solid var(--primary);outline-offset:-1px}
.lcard.bad{background:var(--warnbg)}
.lcard.dragging{opacity:.4}
.lcard.dropbefore{box-shadow:inset 4px 0 0 var(--primary)}
.lcard.dropafter{box-shadow:inset -4px 0 0 var(--primary)}
.lclogo{position:relative;aspect-ratio:16/9;background:var(--tint);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.lclogo img{position:absolute;left:14%;top:16%;width:72%;height:68%;object-fit:contain}
.lclogo .ini{display:grid;place-items:center;color:var(--muted)}
.lcnum{position:absolute;top:6px;left:6px;min-width:28px;height:24px;padding:0 6px;border-radius:7px;background:var(--gold);color:#0B1220;font-weight:800;font-size:13px;display:grid;place-items:center}
.lcnum.playing{box-shadow:0 0 0 3px var(--primary)}
.lcard .grip{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.lcbody{padding:8px 10px 0;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-size:13px}
.lcbody .nm{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lcbody .rowsub{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lcbody .guideline{font-size:12px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lcact{display:flex;justify-content:flex-end;gap:2px;padding:2px 6px 6px}
.lcact .ibtn{width:34px;height:34px;min-width:34px}
.lcbody .badge,.lcbody .pill{font-size:11px}
.lcpanel{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.htiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.phone .htiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.htile{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;text-align:start;cursor:pointer;color:inherit;font:inherit;min-width:0;text-decoration:none}
.htlogo{position:relative;aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);background:var(--tint);display:grid;place-items:center;overflow:hidden}
.htile.playing .htlogo{outline:3px solid var(--primary);outline-offset:-2px}
.htlogo img{position:absolute;left:12%;top:14%;width:76%;height:72%;object-fit:contain}
.hasimg .ini{visibility:hidden}
.logo.hasimg{color:transparent}
.htlogo .ini{display:grid;place-items:center;color:var(--muted)}
.htnum{position:absolute;top:5px;left:5px;min-width:24px;height:20px;padding:0 5px;border-radius:6px;background:var(--gold);color:#0B1220;font-weight:800;font-size:12px;display:grid;place-items:center}
.htname{font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile:hover .htlogo{border-color:var(--primary)}
.htile:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:12px}
.htile:disabled{opacity:.5;cursor:default}
.ytlive{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ytl{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ytav{position:relative;width:48px;height:48px;flex:none;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--muted)}
.ytav img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ytav .livetag{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:#d6202a;color:#fff;font-size:9px;line-height:13px;font-weight:800;letter-spacing:.04em;padding:0 4px;border-radius:4px;border:2px solid var(--card)}
.phone .ytlive{grid-template-columns:minmax(0,1fr)}
.tvlogo{width:96px;height:60px;object-fit:contain;border-radius:10px;background:#fff;padding:6px;margin-top:6px}
body.rowdrag{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.rowdrag .grip{cursor:grabbing}
.nm{font-weight:700;font-size:16px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.flag{display:flex;align-items:center;gap:6px;color:var(--warnink);font-weight:600;font-size:12px;line-height:16px;margin-top:4px}
.editpanel{margin:0 0 8px;padding:16px;border-radius:14px;border:1px solid var(--primary);background:var(--card)}
.grip{color:var(--muted);width:28px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
.callout{background:var(--hl);color:#1c1c1c;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.callout .btn{background:#1c1c1c;color:#fcfcfc;border-color:transparent}
.tvcard{background:var(--navy);color:#F2F4F8;border-radius:20px;padding:24px;display:flex;align-items:center;gap:24px}
.phone .tvcard{padding:18px;gap:16px}
.tvnum{font-size:88px;line-height:1;font-weight:800;color:var(--gold);letter-spacing:-.03em;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.phone .tvnum{font-size:60px;min-width:64px}
.tvcard .btn{background:rgba(242,244,248,.12);color:#F2F4F8;border-color:transparent}
.tvcard .btn.pri{background:var(--gold);color:#0B1220}
.tvcard .cap{color:#b8c2d4}
.icobox{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icobox.warn{background:var(--warnbg);color:var(--warnink)}.icobox.err{background:var(--errbg);color:var(--errink)}.icobox.ok{background:var(--mint);color:var(--okink)}.icobox.pr{background:var(--primary);color:var(--onp)}.icobox.t{background:var(--tint);color:var(--ink)}
.divider{height:1px;background:var(--line);margin:4px 0}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;min-height:56px}
.grp{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 -12px}
details.advanced{margin-top:24px}
details.advanced>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);list-style:none}
details.advanced>summary::-webkit-details-marker{display:none}
details.limits>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none}
details.limits>summary::-webkit-details-marker{display:none}
.inp.jobpick{width:auto;flex:0 1 250px;min-width:0}
.phone .inp.jobpick{flex:1 1 100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.phone .chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.chip .c{color:var(--muted);font-weight:500}.chip.on .c{color:inherit;opacity:.75}
.lchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--tint);font-weight:600;max-width:100%}
.lchip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lchip .n{min-width:32px;height:32px;padding:0 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800}
.lchip .n.playing{background:var(--navy);color:var(--gold);border-color:transparent}
.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--primary);position:sticky;top:8px;z-index:4;box-shadow:0 6px 20px rgba(28,28,28,.08)}
.phone .savebar{top:auto;bottom:84px;position:sticky}
.toasts{position:fixed;inset-inline:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.phone .toasts{bottom:96px}
.toast{display:inline-flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;min-height:44px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;pointer-events:auto;max-width:calc(100vw - 32px)}

const ico = (name, size = 20, sw = 1.8) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[name]}"/></svg>`;

  const words = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return '';

/** The Telly mark on its gold tile (the favicon), for the logo in the page's corner. */
const TELLY_MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#FFC857"/><g transform="translate(5 5) scale(.84)"><g stroke="#1B2A41" stroke-width="4.4" stroke-linecap="round"><line x1="24" y1="16" x2="11" y2="5.5"/><line x1="41" y1="16" x2="53" y2="3.5"/></g><circle cx="10.5" cy="5" r="3.8" fill="#1B2A41"/><circle cx="53.5" cy="3" r="3.8" fill="#1B2A41"/><rect x="4" y="14" width="56" height="42" rx="17" fill="#1B2A41"/><circle cx="22.5" cy="30" r="4.2" fill="#FFC857"/><circle cx="41.5" cy="30" r="4.2" fill="#FFC857"/><path d="M20.5 37.5H43.5Q43.5 50.5 32 50.5Q20.5 50.5 20.5 37.5Z" fill="#FFC857"/></g></svg>';

  const days = Math.round((startOfDay(now) - startOfDay(t)) / DAY);

async function api(path, opts = {}) {

      </section>`);
    const sync = () => { form = { name: $('#fsName').value, kind: form.kind, url: $('#fsUrl').value, username: $('#fsUser').value, password: $('#fsPw').value }; };
    $$('[data-kind]').forEach((b) => b.onclick = () => { sync(); form.kind = b.dataset.kind; step1Form(); });
    $('#fsGo').onclick = async () => {
      sync(); const b = $('#fsGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Checking…';
      const body = { name: form.name.trim() || 'My TV subscription', kind: form.kind, url: form.url.trim(), username: form.username.trim() || null, password: form.password || null };
      try {
        const t = await POST('/api/providers/test', body);
        if (!t.ok) { err = t.message; step1Form(); return; }
        const r = await POST('/api/providers', body);
        state.providers = r.providers; err = ''; form.password = '';
        go('#/first/2?pid=' + encodeURIComponent(r.provider.id));
      } catch (e) { if (e.status !== 401) { err = e.message; step1Form(); } }
    };
  }
  async function step2(seq) {
    const pid = route.q.get('pid') || (state.providers && state.providers.providers[0] && state.providers.providers[0].id);
    if (!pid) { go('#/first'); return; }
    let r;
    try { r = await GET(`/api/catalog/${encodeURIComponent(pid)}/categories?type=live`); } catch (e) { return; }
    if (stale(seq)) return;
    const p = (state.providers.providers || []).find((x) => x.id === pid);
    if (!r.loaded) {
      frame(2, `<div><h1 class="h1">Getting your channel list</h1><p class="muted">${r.refreshing ? 'Big lists take a minute. Keep this page open.' : esc(r.status.error || 'Waiting for the provider…')}</p></div>
        <section class="card f g16"><span class="spin" style="width:28px;height:28px"></span><div class="grow"><div class="sec" dir="auto">${esc(p ? p.name : '')}</div><div class="cap">Downloading on the TV</div></div></section>`);
      pollT = setTimeout(() => { if (route.name === 'first' && route.parts[0] === '2') render(renderSeq); }, 4000);
      return;
    }
    const cats = r.categories; fcats = cats;
    const total = cats.filter((c) => picked.has(c.id)).reduce((n, c) => n + c.count, 0);
    frame(2, `<div><h1 class="h1">Add a few channels</h1><p class="muted">Start small. Six to ten is plenty. You can add more any time.</p></div>
      <section class="card col g4">
        <div class="cap" style="padding:0 8px 4px">FROM ${esc((p ? p.name : '').toUpperCase())} · ${fmtN(r.status.live)} CHANNELS</div>
        ${cats.length > 8 ? `<div style="padding:4px 0 8px">${findBox('fsFind', fFind, `Find a category, like news or arabic (${fmtN(cats.length)})`)}</div>` : ''}
        <div id="fsCats"></div>
      </section>
      <div class="hint">Choosing a whole category adds all its channels. You'll tidy the list next.</div>
      <button class="btn pri block" id="fsAdd" ${total ? '' : 'disabled'}>${total ? 'Add ' + plural(total, 'channel') : 'Pick a category'}</button>`);
    paintFirstCats();
    const ff = $('#fsFind'); if (ff) ff.oninput = () => { fFind = ff.value; fShown = 30; paintFirstCats(); };
    $('#fsAdd').onclick = async () => {
      const n = fcats.filter((x) => picked.has(x.id)).reduce((s, x) => s + x.count, 0);
      if (!n || !(await confirmMany(n, nextNumber()))) return;
      try { const a = await saving(() => POST('/api/channels/catalog', { providerId: pid, categories: [...picked] }), null); state.lineup = a.lineup; snapshot(); picked.clear(); go('#/first/3'); } catch (e) { /* toast */ }
    };
  }
  /** The category list on its own: ticking a box or typing in the lookup only redraws this. */
  function paintFirstCats() {
    const box = $('#fsCats'); if (!box) return;
    const found = fFind.trim() ? fcats.filter((c) => matchesAll(c.name, fFind)) : fcats;
    const shown = found.slice(0, fShown);
    box.innerHTML = found.length ? shown.map((c) => `<label class="chk"><input type="checkbox" data-c="${esc(c.id)}" ${picked.has(c.id) ? 'checked' : ''}><span class="grow"><span class="nm" dir="auto">${esc(c.name)}</span><span class="cap">${plural(c.count, 'channel')}</span></span></label>`).join('')
      + moreLine('fsMore', false, shown.length, found.length, 'categories')
      : `<p class="cap" style="padding:8px">No category matches “${esc(fFind.trim())}”.</p>`;
    $$('[data-c]', box).forEach((c) => c.onchange = () => {
      if (c.checked) picked.add(c.dataset.c); else picked.delete(c.dataset.c);
      const total = fcats.filter((x) => picked.has(x.id)).reduce((n, x) => n + x.count, 0);
      const b = $('#fsAdd'); b.disabled = !total; b.textContent = total ? 'Add ' + plural(total, 'channel') : 'Pick a category';
    });
    infinite('firstrun', 'fsMore', () => { fShown += 30; paintFirstCats(); });
  }
  function step3() {
    const first = state.lineup && state.lineup.channels[0];
    frame(3, `<div><h1 class="h1">Now take a look at the TV</h1><p class="muted">Your channels are saved. Press up or down on the remote to change channel.</p></div>
      ${first ? `<div class="tvcard"><div class="tvnum">${esc(first.number)}</div><div style="font-size:24px;line-height:30px;font-weight:700" dir="auto">${esc(first.name)}</div></div>` : ''}
      <div class="f fw g8">${first ? `<button class="btn pri" id="fsPlay">${ico('play', 18)}Play channel ${esc(first.number)} on TV</button>` : ''}<a class="btn" href="#/lineup">Go to my lineup</a></div>`);
    const b = $('#fsPlay'); if (b) b.onclick = () => playOnTv({ channelId: first.id }, first.name);
  }
  return { render };
})();

/* ---------- Sign in with the PIN ---------- */
let loginShown = false;
async function showLogin() {
  if (loginShown) return; loginShown = true;
  let pin = ''; let msg = null; let lockedUntil = 0; let busy = false;
  try { const a = await GET('/api/auth'); if (!a.pinSet || a.signedIn) { loginShown = false; render(); return; } lockedUntil = a.lockedUntil ? Date.now() + (a.lockedUntil - a.now) : 0; } catch (e) { /* show the form anyway */ }
  let tick = null;
  const locked = () => lockedUntil > Date.now();
  function paint() {
    const isLocked = locked();
    if (isLocked && !msg) msg = { k: 'warn', t: `Too many tries. You can try again in ${Math.max(1, Math.ceil((lockedUntil - Date.now()) / 60000))} minutes.` };
    $('#app').className = 'app ' + currentSize;
    $('#app').innerHTML = `<div class="solo grow"><div class="center col g24" style="max-width:420px">
      <div class="logo-mark">${TELLY_MARK}</div>
      <div><h1 class="h1">Enter your PIN</h1><p class="muted">This keeps the TV settings to you. Your lineup is safe until you unlock.</p></div>
      <label class="col g8"><span class="sr">PIN</span>
        <div class="pin ${msg && msg.k === 'err' ? 'bad' : ''} ${isLocked ? 'locked' : ''}" aria-hidden="true">${Array.from({ length: 6 }, (_, i) => `<span class="${i === pin.length && !isLocked ? 'cur' : ''}">${i < pin.length ? '•' : ''}</span>`).join('')}</div>
        <input id="pinIn" class="sr" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" value="${esc(pin)}" ${isLocked ? 'disabled' : ''} aria-label="PIN">
      </label>
      ${msg ? `<div class="pill ${msg.k} wrap" role="alert">${esc(msg.t)}</div>` : ''}
      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map((k) => k === '' ? '<span></span>' : `<button class="ibtn bd ${isLocked ? 'dis' : ''}" data-k="${k}" aria-label="${k === 'del' ? 'Delete' : 'Digit ' + k}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>
      <button class="btn pri block ${isLocked || pin.length < 4 || busy ? 'dis' : ''}" id="unlock">${busy ? '<span class="spin"></span>' : ''}Unlock</button>
      <details><summary>${ico('right', 18)}Forgot your PIN?</summary><p class="muted">The PIN is shown on the TV's settings screen. Press MENU on the remote, look there, then come back.</p></details>
    </div></div>`;
    document.title = 'Enter your PIN · Telly';
    const inp = $('#pinIn');
    if (!isLocked && currentSize !== 'phone') inp.focus();
    inp.oninput = () => { pin = inp.value.replace(/\D/g, '').slice(0, 6); if (msg && msg.k === 'err') msg = null; paint(); };
    inp.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
    $$('[data-k]').forEach((b) => b.onclick = () => { if (b.dataset.k === 'del') pin = pin.slice(0, -1); else if (pin.length < 6) pin += b.dataset.k; if (msg && msg.k === 'err') msg = null; paint(); });
    $('#unlock').onclick = submit;
  }
  async function submit() {
    if (locked() || pin.length < 4 || busy) return;
    busy = true; paint();
    try {
      const r = await POST('/api/auth/login', { pin });
      state.token = r.token || null; store.sset('stv.token', state.token);
      loginShown = false; clearInterval(tick); render();
    } catch (e) {
      busy = false; pin = '';
      const b = e.body || {};
      if (b.code === 'locked') { lockedUntil = Date.now() + (b.retryAfterSeconds || 300) * 1000; msg = { k: 'warn', t: e.message }; }
      else if (b.code === 'wrong') msg = { k: 'err', t: e.message };
      else msg = { k: 'err', t: e.status === 0 ? "Couldn't reach the TV. Check it's on." : e.message };
      paint();
    }
  }
  tick = setInterval(() => { if (lockedUntil && !locked()) { lockedUntil = 0; msg = null; paint(); } }, 5000);
  paint();
}

/* ---------- Start ---------- */
applyTheme();
$('#app').className = 'app ' + currentSize;
(async () => {
  restoreSnapshot(); state.online = true;
  try {
    const a = await GET('/api/auth');
    if (a.pinSet && !a.signedIn) { state.token = null; store.sset('stv.token', null); showLogin(); }
    else render();
  } catch (e) { if (e.status !== 401) render(); }
  setInterval(() => { if (!document.hidden && !loginShown && route.name !== 'first') refreshNow(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !loginShown) refreshNow(); });
})();
</script>
</body>
